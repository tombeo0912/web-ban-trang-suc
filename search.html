<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tìm kiếm — Bạc Hải Yến</title>
<meta name="description" content="Tìm trang sức bạc tại Bạc Hải Yến theo tên, mã hàng, chất liệu hoặc loại đá.">
<!-- Trang kết quả tìm kiếm: không cho máy tìm kiếm đánh chỉ mục để tránh
     nội dung trùng lặp với trang danh mục -->
<meta name="robots" content="noindex, follow">
<link rel="icon" href="assets/logo/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body data-page="search">

<a class="skip-link" href="#main">Bỏ qua điều hướng, tới nội dung chính</a>

<div data-header></div>

<main id="main">
  <div class="wrap" style="padding-block:32px 64px">

    <nav class="crumbs" aria-label="Đường dẫn">
      <ol>
        <li><a href="index.html">Trang chủ</a></li>
        <li><span aria-current="page">Tìm kiếm</span></li>
      </ol>
    </nav>

    <header class="mb-4" style="max-width:640px">
      <span class="eyebrow">Tìm kiếm</span>
      <h1>Tìm món bạn cần</h1>
      <p class="text-soft text-sm mt-2">
        Tìm theo tên sản phẩm, mã hàng, chất liệu hoặc loại đá. Không cần gõ dấu —
        gõ “nhan bac” cũng ra “nhẫn bạc”.
      </p>
    </header>

    <!-- Biểu mẫu tìm kiếm.
         Dùng thẻ form thật để bấm Enter hoặc nút đều chạy, và URL luôn chứa
         từ khóa để chia sẻ link được. -->
    <form id="search-form" class="mb-5" role="search" style="max-width:640px">
      <label class="sr-only" for="search-input">Từ khóa tìm kiếm</label>
      <div class="row" style="gap:8px">
        <input
          class="input"
          id="search-input"
          name="q"
          type="search"
          placeholder="Ví dụ: nhẫn đá xanh, BHY-K003, ngọc trai…"
          autocomplete="off"
          style="flex:1 1 260px">
        <button class="btn" type="submit">Tìm</button>
      </div>
    </form>

    <!-- Gợi ý từ khóa: chỉ là lối vào nhanh, không phải dữ liệu giả -->
    <div class="mb-5">
      <p class="text-xs text-soft mb-3">Hoặc bắt đầu từ một trong các nhóm sau:</p>
      <div class="chips" style="margin:0">
        <a class="chip" href="catalog.html?category=nhan" style="text-decoration:none">Nhẫn</a>
        <a class="chip" href="catalog.html?category=bong-tai" style="text-decoration:none">Bông tai</a>
        <a class="chip" href="catalog.html?category=khuyen-nu" style="text-decoration:none">Khuyên nụ</a>
        <a class="chip" href="catalog.html?material=Bạc%20925" style="text-decoration:none">Bạc 925</a>
        <a class="chip" href="catalog.html?stone=Ngọc%20trai" style="text-decoration:none">Ngọc trai</a>
      </div>
    </div>

    <!-- Thanh công cụ và kết quả -->
    <div class="toolbar">
      <span class="toolbar__count" id="count" aria-live="polite">Đang tải…</span>
      <div class="toolbar__right">
        <label class="sr-only" for="sort">Sắp xếp theo</label>
        <select class="select" id="sort">
          <option value="newest">Mới nhất</option>
          <option value="price-asc">Giá tăng dần</option>
          <option value="price-desc">Giá giảm dần</option>
          <option value="name-asc">Tên A → Z</option>
        </select>
      </div>
    </div>

    <div class="chips" id="chips" hidden></div>

    <div class="product-grid" id="results"></div>

    <nav class="row" id="pagination" style="justify-content:center;margin-top:32px"
         aria-label="Phân trang"></nav>

  </div>
</main>

<div data-footer></div>

<script src="data/config.js"></script>
<script src="js/core.js"></script>
<script src="js/catalog.js"></script>

</body>
</html>
